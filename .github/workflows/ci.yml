name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run test:node
      - run: npm run typecheck

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx ng build

  full-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:full-loop
      - uses: actions/upload-artifact@v4
        with:
          name: full-loop-recording
          path: tmp/full-loop/create-deal.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: full-loop-report, path: playwright-report }

  generated-playwright:
    needs: full-loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: full-loop-recording, path: tmp/full-loop }
      - run: npm run e2e:generate
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: generated-playwright-report, path: playwright-report }

  generated-cypress:
    needs: full-loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: full-loop-recording, path: tmp/full-loop }
      - run: npm run e2e:generate
      - run: npm run e2e:cypress
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: generated-cypress-screenshots, path: cypress/screenshots }

  # Early warning only: the copy units must keep compiling on newer Angular majors.
  angular-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: >
          npm install --no-audit --no-fund --force
          @angular/core@latest @angular/common@latest @angular/compiler@latest @angular/forms@latest
          @angular/platform-browser@latest @angular/router@latest @angular/build@latest @angular/cli@latest
          @angular/compiler-cli@latest @angular/material@latest @angular/cdk@latest
          @testing-library/angular@latest typescript@latest
      - run: npx ng build
      - run: npm test -- --watch=false
